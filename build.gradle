subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'com.example'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java

                // THIS CAUSES THE SLOWDOWN - triggers eachElement() traversal during CC serialization
                versionMapping {
                    allVariants {
                        fromResolutionResult()
                    }
                }
            }
        }
    }

    // Disabling these tasks doesn't help - disabled tasks are still in the task graph
    // and still get serialized by CC, triggering the expensive computation
    tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }
    tasks.withType(GenerateMavenPom).configureEach { enabled = false }


    // The goal here is to create a large resolved graph
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web:3.2.1'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.1'
        implementation 'software.amazon.awssdk:s3:2.22.9'

        // Inter-project dependencies - creates large resolved graph
        def libNum = project.name.replace('lib', '').toInteger()
        if (libNum > 1) implementation project(':lib1')
        if (libNum > 2) implementation project(':lib2')
        if (libNum > 3) implementation project(':lib3')
        if (libNum > 5) implementation project(":lib${libNum - 1}")
        if (libNum > 10) implementation project(":lib${(libNum / 2).intValue()}")
        if (libNum > 20) implementation project(":lib${(libNum / 3).intValue()}")
        if (libNum > 50) implementation project(":lib${(libNum / 4).intValue()}")

        // Dependency constraints - triggers expensive eachElement() per constraint
        constraints {
            (1..4000).each { i ->
                implementation("com.example.synthetic:lib-${i}:1.0.0")
            }
        }
    }
}
